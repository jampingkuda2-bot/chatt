<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login - ChatApp</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="aurora"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="brand">💬</div>
      <h1>Selamat Datang</h1>
      <p class="sub">Login untuk lanjut ngobrol</p>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Masuk</button>
      </form>
      <p class="error" id="errorMsg"></p>
      <p class="switch">Belum punya akun? <a href="/index.html">Daftar di sini</a></p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
